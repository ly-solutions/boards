name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: situation
    attributes:
      label: What are you trying to do?
      description: The situation you are in and the outcome you want. Describe the goal before the solution.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Your current workaround and what makes it slow, error-prone or impossible.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What boards could do. API shape, UI sketch or configuration option, if you have one in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
