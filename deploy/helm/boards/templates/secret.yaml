{{- if include "boards.createSecret" . }}
{{- $v := .Values }}
{{- $name := include "boards.fullname" . }}
{{- /* Reuse generated values on upgrade. `lookup` returns nothing under `helm template` and in most GitOps tools. */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $old := $existing.data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "boards.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $v.auth.apiTokens }}
  BOARDS_API_TOKENS: {{ join "," $v.auth.apiTokens | b64enc | quote }}
  {{- else if include "boards.generateApiToken" . }}
  BOARDS_API_TOKENS: {{ get $old "BOARDS_API_TOKENS" | default (randAlphaNum 48 | b64enc) | quote }}
  {{- end }}
  {{- if $v.auth.sessionSecret }}
  BOARDS_SESSION_SECRET: {{ $v.auth.sessionSecret | b64enc | quote }}
  {{- else }}
  BOARDS_SESSION_SECRET: {{ get $old "BOARDS_SESSION_SECRET" | default (randAlphaNum 48 | b64enc) | quote }}
  {{- end }}
  {{- if eq $v.storage.driver "s3" }}
  {{- with $v.storage.s3.credentials }}
  {{- if .accessKeyId }}
  BOARDS_S3_ACCESS_KEY_ID: {{ .accessKeyId | b64enc | quote }}
  BOARDS_S3_SECRET_ACCESS_KEY: {{ .secretAccessKey | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and (eq $v.auth.mode "oidc") $v.auth.oidc.clientSecret }}
  BOARDS_OIDC_CLIENT_SECRET: {{ $v.auth.oidc.clientSecret | b64enc | quote }}
  {{- end }}
  {{- if and (eq $v.auth.mode "proxy") $v.auth.proxy.secret }}
  BOARDS_PROXY_SECRET: {{ $v.auth.proxy.secret | b64enc | quote }}
  {{- end }}
  {{- with $v.webhook.secret }}
  BOARDS_COMMENTS_WEBHOOK_SECRET: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
