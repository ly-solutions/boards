apiVersion: v1
kind: Pod
metadata:
  name: {{ include "boards.fullname" . }}-test-connection
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    # Reuses the app image (already on the node) instead of pulling a separate client image.
    - name: healthz
      image: {{ include "boards.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      command:
        - node
        - -e
        - |
          const url = 'http://{{ include "boards.fullname" . }}:{{ .Values.service.port }}/healthz'
          fetch(url).then(async (r) => { console.log(r.status, await r.text()); process.exit(r.ok ? 0 : 1) })
            .catch((e) => { console.error(url, e.message); process.exit(1) })
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
