apiVersion: apps/v1
kind: Deployment
metadata:
  name: boards
  labels:
    app.kubernetes.io/name: boards
spec:
  # Live board state is held in process memory: exactly one replica, never scaled out.
  replicas: 1
  revisionHistoryLimit: 3
  # Safe with S3: writes carry ETag preconditions and the loser merges. Use `type: Recreate` with a ReadWriteOnce
  # volume (BOARDS_STORAGE=fs).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: boards
  template:
    metadata:
      labels:
        app.kubernetes.io/name: boards
    spec:
      serviceAccountName: boards
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # SIGTERM flushes every dirty board to storage before the process exits.
      terminationGracePeriodSeconds: 30
      containers:
        - name: boards
          image: ghcr.io/ly-solutions/boards
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          # Full reference: server/config.mjs (OPTIONS) / docs. Patch these in an overlay.
          env:
            - name: BOARDS_PUBLIC_URL
              value: https://boards.example.com
            - name: BOARDS_STORAGE
              value: s3
            - name: BOARDS_S3_BUCKET
              value: boards
            - name: BOARDS_S3_REGION
              value: us-east-1
            - name: BOARDS_AUTH
              value: token
            - name: BOARDS_METRICS_PORT
              value: "9090"
          # BOARDS_API_TOKENS (required in token mode), BOARDS_SESSION_SECRET, optional S3 keys, OIDC client secret...
          envFrom:
            - secretRef:
                name: boards-secrets
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
